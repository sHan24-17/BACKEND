name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas de integración
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bd_dp_prueba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bd_dp_prueba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5050
      API_VERSION: v1
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bd_dp_prueba_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bd_dp_prueba_test?schema=public
      DEFAULT_PAGE: 1
      DEFAULT_LIMIT: 10
      MAX_LIMIT: 100

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Crear esquema en PostgreSQL
        run: npx prisma db push --skip-generate

      - name: Ejecutar pruebas
        run: npm test

  despliegue:
    name: Desplegar en Render
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::No existe el secreto RENDER_DEPLOY_HOOK_URL; se omite el despliegue."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
